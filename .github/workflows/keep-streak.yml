name: Keep GitHub streak active

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record daily activity
        shell: bash
        run: |
          mkdir -p .github/streak
          printf '%s\n' "${{ github.run_started_at }}" > .github/streak/last-activity.txt
          printf '%s\n' "Automated daily activity marker." > .github/streak/README.md

      - name: Commit activity
        shell: bash
        run: |
          git config user.name "Lord-shaban"
          git config user.email "a.shaban2366@nu.edu.eg"
          git add .github/streak
          git diff --cached --quiet || git commit -m "chore: daily activity"
          git push
