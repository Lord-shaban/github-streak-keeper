name: Keep GitHub streak active

on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record activity
        shell: bash
        run: |
          mkdir -p .github/streak
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/streak/last-activity.txt
          echo "Automated activity marker." > .github/streak/README.md

      - name: Commit activity
        shell: bash
        run: |
          git config user.name "Lord-shaban"
          git config user.email "189514970+Lord-shaban@users.noreply.github.com"
          git add .github/streak
          git diff --cached --quiet || git commit -m "chore: automated activity"
          git push
